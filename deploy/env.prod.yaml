# Cloud Run environment for coauthored-browse on ai-coauthored. CLASSIC_DB_URI is a secret.
BASE_SERVER: aicoauthored.dev
AUTH_SERVER: submit.aicoauthored.dev
SUBMIT_SERVER: submit.aicoauthored.dev
DOCUMENT_ABSTRACT_SERVICE: browse.services.documents.db_docs
DOCUMENT_LISTING_SERVICE: browse.services.listing.db_listing
DISSEMINATION_STORAGE_PREFIX: gs://ai-coauthored-papers
SOURCE_STORAGE_PREFIX: gs://ai-coauthored-papers
ABS_PATH_ROOT: gs://ai-coauthored-papers
DOCUMENT_CACHE_PATH: gs://ai-coauthored-papers/ps_cache
DOCUMENT_LISTING_PATH: gs://ai-coauthored-papers/ftp
LATEXML_ENABLED: "0"
LATEXML_DB_URI: ""
FLASKS3_ACTIVE: "0"
BROWSE_ANALYTICS_ENABLED: "0"
COAUTHORED_HELP_EMAIL: admin@aicoauthored.dev
LOGLEVEL: "20"
GUNICORN: "gunicorn --bind :8080 --workers 2 --threads 8 --timeout 0 browse.factory:create_web_app()"
