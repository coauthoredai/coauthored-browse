# Cloud Run environment for coauthored-browse. CLASSIC_DB_URI comes from Secret Manager.
BASE_SERVER: aicoauthored.dev
# coauthored-submit runs on its own subdomain (sign-in, submit, account, moderation).
AUTH_SERVER: submit.aicoauthored.dev
SUBMIT_SERVER: submit.aicoauthored.dev
DOCUMENT_ABSTRACT_SERVICE: browse.services.documents.db_docs
DOCUMENT_LISTING_SERVICE: browse.services.listing.db_listing
DISSEMINATION_STORAGE_PREFIX: gs://coauthored-papers
SOURCE_STORAGE_PREFIX: gs://coauthored-papers
ABS_PATH_ROOT: gs://coauthored-papers
DOCUMENT_CACHE_PATH: gs://coauthored-papers/ps_cache
DOCUMENT_LISTING_PATH: gs://coauthored-papers/ftp
LATEXML_ENABLED: "0"
LATEXML_DB_URI: "sqlite:///:memory:"
FLASKS3_ACTIVE: "0"
BROWSE_ANALYTICS_ENABLED: "0"
COAUTHORED_HELP_EMAIL: admin@aicoauthored.dev
LOGLEVEL: "20"
